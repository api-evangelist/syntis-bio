aid: syntis-bio
name: Syntis Bio
description: >-
  Syntis Bio is a clinical-stage biopharmaceutical company in Boston, Massachusetts developing
  oral therapies that use the small intestine as a delivery site. Its SYNT platform (Synthetic
  Tissue-lining) applies a mussel-inspired polydopamine polymer coating transiently to specific
  tissues in the GI tract, sustaining therapeutic activity for up to 24 hours before being
  naturally cleared. The platform is being applied to nutrient exclusion for obesity, gut-restricted
  enzyme replacement for rare metabolic disorders such as homocystinuria and maple syrup urine
  disease, and oral bioavailability enhancement for peptides and biologics. Lead candidate SYNT-101
  is a once-daily oral pill intended to mimic aspects of gastric bypass by transiently blocking
  nutrient absorption in the duodenum. The company was co-founded in 2022 by MIT's Robert Langer and
  Giovanni Traverso with CEO Rahul Dhanda. Syntis Bio is a therapeutics developer and publishes no
  public API, developer program, SDK, or machine-readable specification.
